services:
  - type: web
    name: flashcards-api
    runtime: node
    buildCommand: "cd backend && rm -f .npmrc && npm install --legacy-peer-deps && npm run build"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
    autoDeploy: true
    healthCheckPath: /health
